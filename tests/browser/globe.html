<!doctype html><meta charset="utf-8"><title>harness: globe</title>
<iframe id="f" src="/" width="1200" height="900"></iframe>
<script>
// The optional globe view, without a token (the harness serves an empty one): Classic view is the
// default, Globe starts in offline mode (or, without WebGL, falls back to Classic with a note),
// and each region runs its preset's Demo button. See tests/test_page_browser.py.
const sleep = ms => new Promise(r => setTimeout(r, ms));
const out = {errors: [], selects: []};
const report = () => fetch('/__harness/result/globe', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(out)});
const visible = el => !!el && !el.hidden && el.getClientRects().length > 0;
(async () => {
  try {
    try { localStorage.setItem('estd.guide.enabled', 'off'); localStorage.setItem('estd.guide.tutorialSeen', '1'); } catch (e) {}
    try { localStorage.setItem('estd.globe.stage', 'map'); } catch (e) {}   // saved Terrain map: offline must still open Earth
    const f = document.getElementById('f');
    if (!f.contentDocument || f.contentDocument.readyState !== 'complete' || f.contentWindow.location.href === 'about:blank')
      await new Promise(r => f.addEventListener('load', r, {once: true}));
    const d = f.contentDocument, w = f.contentWindow, $ = id => d.getElementById(id);
    w.addEventListener('error', e => out.errors.push(String(e.message)));
    w.addEventListener('unhandledrejection', e => out.errors.push('rejection: ' + e.reason));
    for (const k of ['error', 'warn']) {
      const orig = w.console[k];
      w.console[k] = (...a) => { out.errors.push(`console.${k}: ${a.join(' ')}`); orig.apply(w.console, a); };
    }
    for (let i = 0; i < 100 && !(d.querySelectorAll('#demos button').length && $('viewToggle')); i++) await sleep(100);
    const pressed = () => [...d.querySelectorAll('#viewToggle button')].map(b => [b.textContent, b.getAttribute('aria-pressed')]);
    out.initial = {toggle: pressed(), panelShown: visible($('globePanel')), cesiumLoaded: !!w.Cesium,
                   view: w.EstdGlobe && w.EstdGlobe.view};

    d.querySelector('#viewToggle [data-view="globe"]').click();
    out.afterGlobeClick = {panelShown: visible($('globePanel')), toggle: pressed()};
    for (let i = 0; i < 600 && !['ready', 'failed'].includes(w.EstdGlobe.status); i++) await sleep(100);
    const G = w.EstdGlobe;
    out.globe = {status: G.status, mode: G.mode, note: G.note, view: G.view, regions: G.regions.slice(),
                 globeNote: visible($('globeNote')) ? $('globeNote').textContent : null,
                 viewNote: visible($('viewNote')) ? $('viewNote').textContent : null,
                 panelShown: visible($('globePanel')), canvas: !!d.querySelector('#globeBox canvas')};

    if (G.status === 'ready') {
      // the trend-map layer from data/maps/: loaded, nearest-neighbour, experimental layers hidden
      const T = G.trend;
      for (let i = 0; i < 300 && !['ready', 'failed'].includes(T.status); i++) await sleep(100);
      for (let i = 0; i < 150 && T.layer && !T.layer.ready && T.status === 'ready'; i++) await sleep(100);
      const rows = () => [...d.querySelectorAll('#trendPanel .trend-var')].map(r => [r.querySelector('input').value, visible(r)]);
      const C = w.Cesium, L = T.layer;
      out.trend = {status: T.status, key: T.key, panel: visible($('trendPanel')), layerReady: !!(L && L.ready),
                   onTop: !!L && G.viewer.imageryLayers.indexOf(L) === G.viewer.imageryLayers.length - 1,
                   nearest: !!L && L.minificationFilter === C.TextureMinificationFilter.NEAREST &&
                            L.magnificationFilter === C.TextureMagnificationFilter.NEAREST,
                   alpha: L && L.alpha, rows: rows(), caveat: visible(d.querySelector('.trend-caveat')),
                   legend: d.querySelector('.trend-legend') && d.querySelector('.trend-legend').textContent};
      if (T.status === 'ready') {
        $('trendExperimental').click();
        const soil = d.querySelector('#trendPanel input[value="SoilMoi0_10cm_inst"]');
        soil.click();
        out.trend.experimental = {rows: rows(), key: T.key, caveat: visible(d.querySelector('.trend-caveat')) &&
                                  d.querySelector('.trend-caveat').textContent};
        $('trendExperimental').click();
        out.trend.back = {key: T.key, caveat: visible(d.querySelector('.trend-caveat'))};
        $('trendOn').click();
        out.trend.off = {show: T.layer.show};
        $('trendOn').click();
      }
      // relief controls: offline, so only Top-down; the settings are saved all the same
      const v = G.viewer;
      out.relief = {switchShown: visible($('terrainSwitch')), heightShown: visible($('terrainHeight')),
                    topDown: visible($('globeTopDown')), relief: G.relief, defaults: G.readSettings(),
                    collision: v.scene.screenSpaceCameraController.enableCollisionDetection,
                    minZoom: v.scene.screenSpaceCameraController.minimumZoomDistance,
                    maxZoom: v.scene.screenSpaceCameraController.maximumZoomDistance,
                    requestRenderMode: v.scene.requestRenderMode};
      // Terrain map: offline (no token), so its button is disabled with a note and Earth stays as it is
      const mapBtn = d.querySelector('#stageModes [data-stage="map"]');
      out.stage = {stage: G.stage, available: G.mapAvailable, disabled: !!(mapBtn && mapBtn.disabled), note: $('stageNote').textContent,
                   noteShown: visible($('stageNote')), entered: G.setStage('map'), after: G.stage, chips: visible($('mapRegions')),
                   mapPanel: visible($('mapPanel')), earthTopDown: visible($('globeTopDown')), material: !!v.scene.globe.material,
                   sky: !!(v.scene.skyAtmosphere && v.scene.skyAtmosphere.show), body: d.body.dataset.stage};
      G.setExaggeration(2.5); G.setTerrainOn(false);
      out.relief.saved = {terrain: w.localStorage.getItem('estd.globe.terrain'), ex: w.localStorage.getItem('estd.globe.exaggeration'),
                          read: G.readSettings(), offlineEx: v.scene.verticalExaggeration};
      G.setExaggeration(99);
      out.relief.clamped = G.readSettings().exaggeration;
      w.localStorage.removeItem('estd.globe.terrain'); w.localStorage.removeItem('estd.globe.exaggeration');
      G.setTerrainOn(true); G.setExaggeration(1.5);

      // the US outline, the label rule and a cell readout
      const C2 = w.Cesium;
      for (let i = 0; i < 100 && G.outline.status === 'loading'; i++) await sleep(100);
      out.outline = {status: G.outline.status, rings: G.outline.rings,
                     entities: v.entities.values.filter(e => e.id.startsWith('us-outline:')).length};
      out.labels = G.labelShown;
      G.showUS(true);
      await sleep(2800);
      out.usView = {pitch: Math.round(C2.Math.toDegrees(v.camera.pitch))};
      $('globeTopDown').click();
      await sleep(1800);
      out.topDown = {pitch: Math.round(C2.Math.toDegrees(v.camera.pitch))};
      G.showUS(true);
      await sleep(2500);
      // a slow (software-rendered) flight can still be moving: wait until the camera is still before clicking
      for (let i = 0, last = null; i < 40; i++) {
        const now = v.camera.positionWC.clone();
        if (last && C2.Cartesian3.distance(now, last) < 1) break;
        last = now;
        v.scene.requestRender();
        await sleep(250);
      }
      const x = T.variables.find(y => y.key === T.key);
      for (let i = 0; i < 100 && !x.cells; i++) await sleep(100);
      // a known significant cell from the file: decoded by the page, then clicked on screen
      // (one outside every region box: inside one, the box is clicked instead)
      const boxes = (await (await w.fetch('/presets')).json()).map(p => p.bbox);
      const cells = x.cells;
      let flagAt = -1;
      for (let i = Math.floor(cells.flag.length / 3); i < cells.flag.length && flagAt < 0; i++) {
        const la = cells.lat[Math.floor(i / cells.nlon)], lo = cells.lon[i % cells.nlon];
        if (cells.flag[i] === '1' && !boxes.some(b => lo >= b[0] - 1 && lo <= b[2] + 1 && la >= b[1] - 1 && la <= b[3] + 1)) flagAt = i;
      }
      const row = Math.floor(flagAt / cells.nlon), col = flagAt % cells.nlon;
      const known = G.decodeCell(cells, cells.lon[col], cells.lat[row]);
      out.cell = {index: flagAt, row, col, decoded: known,
                  masked: G.decodeCell(cells, cells.lon[0], cells.lat[0]), outside: G.decodeCell(cells, 10, 10)};
      const canvas = v.scene.canvas, at = C2.SceneTransforms.worldToWindowCoordinates(v.scene, C2.Cartesian3.fromDegrees(cells.lon[col], cells.lat[row]));
      const press = (type, p) => canvas.dispatchEvent(new w.PointerEvent(type, {bubbles: true, clientX: canvas.getBoundingClientRect().left + p.x,
                                   clientY: canvas.getBoundingClientRect().top + p.y, pointerId: 1, pointerType: 'mouse', button: 0, buttons: type === 'pointerdown' ? 1 : 0, isPrimary: true}));
      if (at) {
        press('pointerdown', at); press('pointerup', at);
        await sleep(200);
        out.cell.clicked = {shown: visible($('cellCard')), text: $('cellCard').textContent, state: G.cell};
        d.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'Escape', bubbles: true}));
        out.cell.afterEscape = visible($('cellCard'));
        press('pointerdown', at); press('pointerup', at);
        await sleep(200);
        const again = visible($('cellCard'));
        $('trendPanel').dispatchEvent(new w.PointerEvent('pointerdown', {bubbles: true}));
        out.cell.clickElsewhere = {before: again, after: visible($('cellCard'))};
      }
      for (const id of G.regions) {
        $('cardTitle').textContent = ''; $('err').textContent = '';
        const ok = G.selectPreset(id);
        for (let i = 0; i < 200 && !$('err').textContent && !$('cardTitle').textContent; i++) await sleep(25);
        out.selects.push({id, ok, fields: ['w', 's', 'e', 'n'].map(x => $(x).value), lens: $('lens').value,
                          variable: $('variable').value, err: $('err').textContent, card: $('cardTitle').textContent});
      }
      out.unknown = G.selectPreset('not-a-preset');
    }

    d.querySelector('#viewToggle [data-view="classic"]').click();
    out.classic = {panelShown: visible($('globePanel')), toggle: pressed()};
    $('cardTitle').textContent = ''; $('err').textContent = '';
    d.querySelectorAll('#demos button')[0].click();
    for (let i = 0; i < 200 && !$('err').textContent && !$('cardTitle').textContent; i++) await sleep(25);
    out.classic.card = $('cardTitle').textContent;
    out.classic.err = $('err').textContent;
  } catch (e) { out.errors.push('harness: ' + (e && e.stack || e)); }
  await report();
})();
</script>
