<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth System Trend Detective</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #1b2733; }
  header { background: #0b3d91; color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; font-size: .9rem; opacity: .85; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  .panel { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  label { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid #b8c2cc; border-radius: 6px; }
  input[type=number] { width: 90px; }
  button { background: #0b3d91; color: #fff; border: 0; cursor: pointer; padding: 8px 16px; }
  button.secondary { background: #e8eef8; color: #0b3d91; }
  #desc { font-size: .9rem; margin: 10px 0 0; }
  #note { font-size: .8rem; color: #6a5200; margin: 4px 0 0; }
  #card h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .verdict { font-weight: 700; padding: 3px 10px; border-radius: 12px; display: inline-block; }
  .sig { background: #d7f0dd; color: #14532d; }
  .nosig { background: #fdf0c8; color: #6a5200; }
  .stats { display: flex; flex-wrap: wrap; gap: 24px; margin: 12px 0 4px; }
  .stats div span { display: block; font-size: .75rem; color: #5b6b7b; }
  .stats div b { font-size: 1.2rem; }
  #err { color: #b00020; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Earth System Trend Detective</h1>
  <p>Prototype · NASA MERRA-2, GPM IMERG and GLDAS monthly data · regional screening, not site-level analysis</p>
</header>
<main>
  <section class="panel">
    <div class="row">
      <label>Lens <select id="lens"><option value="">None</option></select></label>
      <label>Variable <select id="variable"></select></label>
      <label>West <input type="number" id="w" step="0.5" value="-117"></label>
      <label>South <input type="number" id="s" step="0.5" value="31.3"></label>
      <label>East <input type="number" id="e" step="0.5" value="-109"></label>
      <label>North <input type="number" id="n" step="0.5" value="38"></label>
      <label>Start <input type="month" id="start" value="2000-01"></label>
      <label>End <input type="month" id="end"></label>
      <label style="grid-auto-flow:column;align-items:center"><input type="checkbox" id="deseason" checked> Remove seasonal cycle</label>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="go">Show trend</button>
      <span id="demos"></span>
    </div>
    <p id="desc"></p><p id="note"></p>
    <p id="err"></p>
  </section>

  <section class="panel"><div id="chart" style="height:380px"></div></section>

  <section class="panel hidden" id="card">
    <h2 id="cardTitle"></h2>
    <span class="verdict" id="verdict"></span>
    <div class="stats">
      <div><span>Change per decade</span><b id="slope"></b></div>
      <div><span id="ciLabel">95% range (adjusted for autocorrelation)</span><b id="ci"></b></div>
      <div><span>p-value</span><b id="p"></b></div>
      <div><span>Record length</span><b id="len"></b></div>
    </div>
    <p id="plain"></p>
    <p id="lensMsg" class="hidden"></p>
    <p id="lensCaveat" class="hidden" style="font-size:.85rem;color:#5b6b7b"></p>
    <p id="cardNote" style="font-size:.85rem;color:#6a5200"></p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let vars = [], lensList = [];

async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

function showDesc() {
  const v = vars.find(x => x.id === $('variable').value);
  $('desc').textContent = v ? v.description : '';
  $('note').textContent = (v && v.note ? 'Note: ' + v.note : '') +
    (v && v.period_start ? ` Data available ${v.period_start} to ${v.period_end}.` : '');
}

// the variable dropdown shows only the selected lens's variables (all variables for "None")
async function loadVars(keep) {
  const lens = $('lens').value;
  vars = await api('/variables' + (lens ? '?lens=' + encodeURIComponent(lens) : ''));
  $('variable').innerHTML = vars.map(v => `<option value="${v.id}">${v.name} – ${v.units}${v.has_data ? '' : ' (no data yet)'}</option>`).join('');
  if (keep && vars.some(v => v.id === keep)) $('variable').value = keep;
  showDesc();
}

async function init() {
  lensList = await api('/lenses');
  $('lens').innerHTML = '<option value="">None</option>' +
    lensList.map(l => `<option value="${l.id}" title="${l.description}">${l.name}</option>`).join('');
  $('lens').onchange = () => loadVars($('variable').value).catch(e => $('err').textContent = e.message);
  $('variable').onchange = showDesc;
  await loadVars();
  const presets = await api('/presets');
  const lensName = id => (lensList.find(l => l.id === id) || {name: id}).name;
  $('demos').innerHTML = presets.map(p =>
    `<button class="secondary" data-id="${p.id}" title="${p.why || ''}">Demo: ${p.name} (${lensName(p.lens)})</button>`).join(' ');
  $('demos').querySelectorAll('button').forEach(b => b.onclick = () =>
    demo(presets.find(p => p.id === b.dataset.id)).catch(e => $('err').textContent = 'Something went wrong: ' + e.message));
}

// a demo button selects its region, its lens and the lens's default variable
// (or, if that has no data for this region yet, the first lens variable that does)
async function demo(p) {
  [$('w').value, $('s').value, $('e').value, $('n').value] = p.bbox;
  $('lens').value = p.lens;
  const l = lensList.find(x => x.id === p.lens);
  const ready = l.variables.map(v => v.id).filter(id => p.variables.includes(id));
  await loadVars(ready.includes(l.default_variable) ? l.default_variable : (ready[0] || l.default_variable));
  await run();
}

async function run() {
  $('err').textContent = '';
  const v = vars.find(x => x.id === $('variable').value);
  if (v && !v.has_data) {
    $('err').textContent = `${v.name}: data not available yet. It will appear here once it has been exported; try another variable.`;
    return;
  }
  const bbox = [$('w').value, $('s').value, $('e').value, $('n').value].join(',');
  const q = new URLSearchParams({variable: $('variable').value, bbox, deseasonalize: $('deseason').checked});
  if ($('lens').value) q.set('lens', $('lens').value);
  if ($('start').value) q.set('start', $('start').value);
  if ($('end').value) q.set('end', $('end').value);
  let d;
  try { d = await api('/trend?' + q); } catch (e) { $('err').textContent = e.message; return; }

  if (window.Plotly) {
    Plotly.newPlot('chart', [
      {x: d.dates, y: d.values, mode: 'lines', name: 'Monthly regional mean', line: {color: '#6b8fc7', width: 1.5}},
      {x: d.dates, y: d.fitted, mode: 'lines', name: 'Trend (Sen\'s slope)', line: {color: '#d9480f', width: 3}},
    ], {title: d.name, yaxis: {title: d.units}, margin: {t: 40, r: 10}, legend: {orientation: 'h', y: -0.15}},
    {responsive: true});
  } else {
    $('err').textContent = 'The chart library could not be loaded (check the internet connection); results are shown below.';
  }

  // all wording and number formatting comes from the server (app/display.py, unit-tested)
  $('cardTitle').textContent = d.headline;
  $('verdict').textContent = d.verdict;
  $('verdict').className = 'verdict ' + (d.significant && d.reliability !== 'low' ? 'sig' : 'nosig');
  $('slope').textContent = `${d.slope_text} ${d.units} per decade` + (d.percent_text ? ` (${d.percent_text})` : '');
  $('ci').textContent = d.range_text + (d.percent_range_text ? ` (${d.percent_range_text})` : '');
  $('ciLabel').textContent = d.method === 'corrected' ? '95% range (adjusted for autocorrelation)' : '95% range (plain)';
  $('p').textContent = d.p_value < 0.001 ? '< 0.001' : d.p_value.toFixed(3);
  $('len').textContent = `${d.record_years.toFixed(1)} years (${d.dates[0]} to ${d.dates[d.dates.length - 1]})`;
  $('cardNote').textContent = d.note ? 'Note: ' + d.note : '';
  $('plain').textContent = d.explanation;
  $('lensMsg').textContent = d.lens_message || '';
  $('lensMsg').classList.toggle('hidden', !d.lens_message);
  $('lensCaveat').textContent = d.lens_caveat ? 'Lens caveat: ' + d.lens_caveat : '';
  $('lensCaveat').classList.toggle('hidden', !d.lens_caveat);
  $('card').classList.remove('hidden');
}

$('go').onclick = () => run().catch(e => $('err').textContent = 'Something went wrong: ' + e.message);
init().catch(e => $('err').textContent = e.message);
</script>
</body>
</html>
