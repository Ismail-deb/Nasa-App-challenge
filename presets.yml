# Demo regions. Their monthly regional-mean series are precomputed by export_series.py into
# data/series/ (committed to git), so the demo works without the multi-GB gridded files.
# bbox = [minLon, minLat, maxLon, maxLat] in degrees (longitudes -180..180).
# lens = the recommended lens for this region: solar | wind | hydro | farming
# default_variable (optional) = the variable the scenario loads first; without it, the lens's own default
# source = the data-source label shown on the scenario card (the source of the variable loaded first)
presets:
  southwest:
    name: US Southwest (Arizona and southern Nevada)
    bbox: [-117.0, 31.3, -109.0, 38.0]
    lens: solar
    source: NASA MERRA-2
    why: Sonoran and Mojave deserts, incl. Las Vegas and Phoenix; among the sunniest US regions.
  great_plains:
    name: Great Plains (Texas, Oklahoma, Kansas, Nebraska, Iowa)
    bbox: [-103.0, 30.0, -91.0, 43.5]
    lens: wind
    source: NASA MERRA-2
    why: Central US wind belt from the Texas Panhandle and central Texas north to Iowa.
  pacific_northwest:
    name: Pacific Northwest (Columbia River basin, US part)
    bbox: [-124.0, 42.0, -111.0, 49.0]
    lens: hydro
    source: NASA GLDAS
    why: Washington, Oregon and Idaho; the US share of the Columbia basin, the main US hydropower region.
  central_valley:
    name: California Central Valley
    bbox: [-122.6, 35.0, -118.8, 40.6]
    lens: farming
    default_variable: M2TMNXSLV/T2M
    source: NASA MERRA-2
    why: Sacramento and San Joaquin valleys, from Bakersfield to Redding; major irrigated farming area.
